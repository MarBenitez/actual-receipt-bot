# Runs next to Actual on the same Docker network and talks to it internally (http://actual:5006).
# Find your Actual network with:
#   docker inspect <actual-container> --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}'
# and put it in ACTUAL_NETWORK in your .env.
services:
  receipt-bot:
    build: .
    image: actual-receipt-bot
    container_name: actual-receipt-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - receipt-bot-data:/app/data   # named volume: it keeps the container user's permissions
    mem_limit: 512m
    networks:
      - actual
volumes:
  receipt-bot-data:
networks:
  actual:
    name: ${ACTUAL_NETWORK:-actual_default}
    external: true
